<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InvestorGPT Startup</title>
  <script src="startup_status.js"></script>
  <style>
    :root {
      --bg0: #0b132b;
      --bg1: #1c2541;
      --fg: #e6eef8;
      --muted: #9fb3c8;
      --accent: #3a86ff;
      --card: rgba(11, 19, 43, 0.78);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at 15% 20%, #2a9d8f33 0%, transparent 35%),
        radial-gradient(circle at 80% 15%, #3a86ff40 0%, transparent 30%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(620px, 100%);
      background: var(--card);
      border: 1px solid #ffffff22;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 16px 48px #00000055;
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: 0.2px;
    }
    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .status {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #0f2042;
      border: 1px solid #ffffff1f;
    }
    .label {
      font-size: 0.78rem;
      color: #b9ccdf;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 6px;
    }
    .step {
      font-size: 1.05rem;
      margin: 0 0 6px;
      color: #ffffff;
    }
    .msg {
      margin: 0;
      color: #d2ddee;
      line-height: 1.5;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid #ffffff22;
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
      margin-top: 18px;
    }
    .hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>InvestorGPT is starting</h1>
    <p class="sub">The launcher is preparing data and AI services.</p>

    <section class="status">
      <div class="label">Current Step</div>
      <p id="step" class="step">Waiting for launcher...</p>
      <p id="message" class="msg">Run open_dashboard.bat to begin startup.</p>
    </section>

    <div class="spinner" aria-hidden="true"></div>
    <p class="hint">This page redirects automatically when startup is complete.</p>
  </main>

  <script>
    const stepEl = document.getElementById("step");
    const msgEl = document.getElementById("message");
    let redirected = false;

    function readStatus() {
      const oldScript = document.getElementById("startup-status-script");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "startup-status-script";
      script.src = "startup_status.js?t=" + Date.now();
      script.onload = applyStatus;
      script.onerror = () => {
        msgEl.textContent = "Waiting for launcher status...";
        setTimeout(readStatus, 1000);
      };
      document.head.appendChild(script);
    }

    function applyStatus() {
      const status = window.STARTUP_STATUS || {};
      if (status.step) stepEl.textContent = status.step;
      if (status.message) msgEl.textContent = status.message;

      if (status.ready && !redirected) {
        redirected = true;
        msgEl.textContent = "Startup complete. Redirecting to dashboard...";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);
        return;
      }

      setTimeout(readStatus, 900);
    }

    readStatus();
  </script>
</body>
</html>
